name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project test/runtests.jl
      - run: python3 -m unittest discover -s queue
